[pytest]
addopts = -v --alluredir=reports/allure-results
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    api: CRM 接口回归用例
    login_benchmark: 登录十次基准耗时（串行）
    mobile: 移动端自动化测试
    monkey: Android Monkey 稳定性测试
    appium: Appium 随机探索测试
    esbao: 易食包生产环境商城 UI 巡检
    epak: EPAK 英文站生产环境商城 UI 巡检
    api_negative: CRM 接口异常与边界场景
    order: 订单造数流程
    inquiry_seed: 询价单按状态造数（数据准备）
    crm_ui_draft: CRM 录制会话生成的 UI 草稿（默认勿进日回归）
    crm_ui: CRM UI 冒烟/改版回归
    crm_ui_serial: CRM UI 单会话串行冒烟（盯屏用）
    browser_compat: 浏览器兼容矩阵（需配合 --ui-browsers，默认不启用）
